<section class="footer" id="contact" data-nav="Contact">
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6 col-lg-6 mb-4 mb-md-0">
        <h2>Contact Information</h2>
        <p><strong>Address:</strong> 123 Main Street, City, State, ZIP</p>
        <p><strong>Email:</strong> <a href="mailto:
  
 <div class="contact-container">
        <h2>Contact Us</h2>


        <form method="POST" action="YOUR_FORM_ENDPOINT_URL">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>

        
        <!-- Using FormSubmit.co -->
        <form id="contactForm" action="https://formsubmit.co/cc9fda074df39b4354a537aad5f80b70" method="POST">
            <!-- Honeypot to prevent spam -->
            <input type="text" name="_honey" style="display:none">
            
            <!-- Disable captcha (optional) -->
            <input type="hidden" name="_captcha" value="false">
            
            <!-- Auto redirect after submit -->
            <input type="hidden" name="_next" value="https://yourwebsite.com/thank-you.html">
            
            <!-- Subject line -->
            <input type="hidden" name="_subject" value="New Contact Form Submission">
            
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Subject">
            </div>
            
            <div class="form-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" placeholder="Your message here..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
            
            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            const statusDiv = document.getElementById('statusMessage');
            
            // Show loading state
            statusDiv.className = 'status-message';
            statusDiv.style.display = 'none';
            
            // Form will submit to FormSubmit.co
            // You can add client-side validation here
        });

        // Optional: Add client-side validation
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            const statusDiv = document.getElementById('statusMessage');
            
            if (!name.trim() || !email.trim() || !message.trim()) {
                e.preventDefault();
                statusDiv.className = 'status-message error';
                statusDiv.textContent = 'Please fill in all required fields.';
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                e.preventDefault();
                statusDiv.className = 'status-message error';
                statusDiv.textContent = 'Please enter a valid email address.';
                return;
            }
        });
    </script>

  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="footer-inner">
          <!-- <h2 class="footer-title">{{site.title}}</h2> -->
          <h2 class="footer-title">
            <img title="{{ site.title }}" height="29" alt="{{ site.title }}" src="{{ '/images/logo/BO_Title_BW.png' | relative_url }}" />
          </h2>
          <ul>
            {% assign footermenu = site.data.menus.footer | sort: 'weight'  %}
            {% for item in footermenu %}
            <li class="{% if item.url == page.url %}active{% endif %}">
              <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </div>
  {% include sub-footer.html %}
</section>
