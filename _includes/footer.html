<section class="footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="footer-inner">
          <!-- <h2 class="footer-title">{{site.title}}</h2> -->
          <h2 class="footer-title">
            <img title="{{ site.title }}" height="29" alt="{{ site.title }}" src="{{ '/images/logo/BO_Title_BW.png' | relative_url }}" />
          </h2>
          <ul>
            {% assign footermenu = site.data.menus.footer | sort: 'weight'  %}
            {% for item in footermenu %}
            <li class="{% if item.url == page.url %}active{% endif %}">
              <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </div>
  {% include sub-footer.html %}
</section>
