<section class="contact" id="contact" data-nav="Contact">
  <div class="container">
    <h2 class="section-title text-center mb-2">Get in touch</h2>
    <p class="contact-intro text-center mb-2">Tell me about your project and I'll get back to you.</p>

    <form id="contact-form" class="contact-form" novalidate>
      <div class="form-row">
        <label for="cf-name">Name</label>
        <input id="cf-name" name="name" type="text" required maxlength="100" autocomplete="name" />
      </div>
      <div class="form-row">
        <label for="cf-email">Email</label>
        <input id="cf-email" name="email" type="email" required maxlength="150" autocomplete="email" />
      </div>
      <div class="form-row">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" rows="6" required maxlength="3000"></textarea>
      </div>

      <button type="submit" class="button contact-submit">Send message</button>
      <p class="contact-status" role="status" aria-live="polite"></p>
    </form>
  </div>

</section>

<script>
  document.getElementById("contact").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch("{{ site.contact_form.endpoint }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    alert(res.ok ? "Thanks, message sent!" : "Something went wrong.");
  });
</script>
