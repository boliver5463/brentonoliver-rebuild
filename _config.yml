baseurl: '/'
permalink: pretty
title: 'Brenton Oliver'

logo:
  mobile: "images/logo/logo-mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  BO_Title_color: "images/logo/BO_Title.png"
  desktop: "images/logo/logo.svg"
  # desktop_height: "32px"
  desktop_height: "32px"
  # desktop_width: "120px"
  desktop_width: "213px"

home:
  limit_services: 6

# Contact form. `endpoint` is your deployed Lambda Function URL (public, safe here).
# No CAPTCHA for now — to add one later, set its SITE key here and the SECRET
# only in the Lambda environment (never in this file / repo).
contact_form:
  endpoint: "https://e6yogpuxce4dgcr7hgb5gvupgy0avzgu.lambda-url.ap-southeast-2.on.aws/"

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - lambda
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
